schema_version: "1.0"
name: spec-short-path-given
description: >-
  The user names the short path in the command: the flow records it with the user's words, does not ask again, and goes on to mirror and claim the item.
tags: [spec, short-path]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Glob, Grep, Bash, Write, Edit, AskUserQuestion]
  env:
    SDD_FAKE_ADO: world.json
  prompt: |
    /sdd 502 short
