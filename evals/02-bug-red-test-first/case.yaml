schema_version: "1.0"
name: bug-red-test-first
description: >-
  Bug 501 is real (CR 500 asks for cents). From Phase 7 to Phase 9 the regression test must fail on record before the fix, the fix must land in the worktree only, and Verified must rest on recorded runs.
tags: [bug, test-first, proof]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 60
  timeout_seconds: 1500
  allowed_tools: [Skill, Read, Glob, Grep, Bash, Write, Edit, AskUserQuestion]
  env:
    SDD_FAKE_ADO: world.json
  prompt: |
    ADO 501: you have my approval for the fix summary. Carry on with the sdd bug flow from Phase 7
    through Phase 9, then stop before committing. The test command is `python3 -m unittest` in the
    worktree.
