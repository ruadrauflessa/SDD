schema_version: "1.0"
name: spec-asks-path
description: >-
  A spec item started without a path word: the flow must ask full or short before anything else, and must not choose for the user.
tags: [spec, short-path, should-ask]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Glob, Grep, Bash, Write, Edit, AskUserQuestion]
  env:
    SDD_FAKE_ADO: world.json
  prompt: |
    /sdd 502
